      padding: 10px 48px 10px 12px;
      font-size: 16px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    /* Tombol X Clear */
    .clear-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: #ccc;
      color: #333;
      font-weight: bold;
      font-size: 18px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
      padding: 0;
      transition: background 0.2s, color 0.2s;
    }
    .clear-btn:hover {
      background: #888;
      color: #fff;
    }
    .clear-btn:active {
      background: #555;
      color: #fff;
    }

    #status {
      font-size: 12px;
      color: #666;
      margin-bottom: 15px;
    }
    ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }
    li {
      padding: 12px;
      border-bottom: 1px solid #eee;
      line-height: 1.5;
    }
    li:nth-child(even) {
      background-color: #f9f9f9;
    }
    .no-data {
      color: #888;
      font-style: italic;
    }
    
    /* Styling Visual Jawaban & Pertanyaan */
    .num {

    }
    .q-text {
      color: #222;
    }
    .ans-text {
      color: #28a745;
      font-weight: bold;
    }
    .highlight-lang {
      font-weight: 600;
      color: #0056b3;
    }
    .highlight-quote {
      font-weight: 600;
      color: #d9534f;
    }
    .highlight-brawler {
      font-weight: 600;
      color: #6f42c1;
    }

    .bottom-action-container {
      margin-top: 20px;
      margin-bottom: 30px;
      text-align: center;
      display: none;

    // State Aplikasi (Default: English)
    let currentLang = "English"; 
    let dataID = DEFAULT_DATA.Indonesia;
    let dataEN = DEFAULT_DATA.English;

    // Daftar Bahasa & Negara
    const LANGUAGES = [
      "Indonesia", "Inggris", "Prancis", "Spanyol", "Rusia", "Turki", "Mandarin", 
      "Korea", "Finlandia", "Slovenia", "Wabing", "Jepang", "Italia", "Arab",

      "English", "German", "French", "Spanish", "Russian", "Turkish", "Chinese", 
      "Japanese", "Italian", "Arabic", "Polish", "Dutch", "Hungarian", "Hebrew", 
      "Icelandic", "Portuguese", "Swedish", "Greek", "Vietnamese", "Welsh", "Thai",
      "Finnish", "Indonesian", "Irish", "Korean", "Malay", "Norwegian", "Persian", "Slovenian", "Ukrainian"
    ];

    // Daftar Brawler & Karakter
    const BRAWLERS = [
      "Spike", "Gene", "Rico", "Ricochet", "Edgar", "Mortis", "Dynamike", "Shelly", 
      "Brock", "Nita", "Bibi", "Poco", "Pam", "Darryl", "Chester", "Melody", 
      "Janet", "Jessie", "Duo", "Scrappy", "Cordelius", "Lily", "Trunk"
    ];

    // Regex Dinamis
    const langRegex = new RegExp(`\\b(${LANGUAGES.join("|")})\\b`, "gi");
    const brawlerRegex = new RegExp(`\\b(${BRAWLERS.join("|")})\\b`, "gi");
    const quoteRegex = /(['"ʿ‘«“].*?['"ʾ’»”])/g;

    const searchInput = document.getElementById("search");
    const clearBtn = document.getElementById("clearSearch");
    const appTitle = document.getElementById("appTitle");
    const bottomAction = document.getElementById("bottomAction");
    const btnSearchAgain = document.getElementById("btnSearchAgain");

    document.addEventListener("DOMContentLoaded", async () => {
      // 1. Load dari LocalStorage
      const localID = localStorage.getItem(KEY_ID);
      const localEN = localStorage.getItem(KEY_EN);

      if (localID) {
        try { dataID = JSON.parse(localID); } catch(e){}
      }
      if (localEN) {
        try { dataEN = JSON.parse(localEN); } catch(e){}
      }

      renderResults();

      // 2. Sync background dari API
      await fetchAndSyncData();
    });

    async function fetchAndSyncData() {
      updateStatus("Syncing data from Spreadsheet...");
      try {
        const res = await fetch(API_URL);
        const data = await res.json();

        if (data && (data.Indonesia || data.English)) {
          dataID = data.Indonesia || DEFAULT_DATA.Indonesia;
          dataEN = data.English || DEFAULT_DATA.English;

          localStorage.setItem(KEY_ID, JSON.stringify(dataID));
          localStorage.setItem(KEY_EN, JSON.stringify(dataEN));

          updateStatus("Data synced and saved to LocalStorage.");
          renderResults();
        }
      } catch (err) {
        console.warn("Fetch Error (Using fallback data):", err);
        updateStatus("Displaying local/cached data.");
      }
    }

    // Format Teks Pertanyaan (Highlighting)
    function formatQuestion(qText) {
      if (!qText) return "";
      let formatted = String(qText).replace(quoteRegex, `<span class="highlight-quote">$1</span>`);
      formatted = formatted.replace(langRegex, `<span class="highlight-lang">$1</span>`);
      formatted = formatted.replace(brawlerRegex, `<span class="highlight-brawler">$1</span>`);
      return formatted;
    }

    // Fungsi Reset Search untuk digunakan tombol X & tombol bawah
    function clearSearch() {
      searchInput.value = "";
      searchInput.focus();
      renderResults();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Render Hasil Pencarian (dengan AND Logika Multi-Keyword)
    function renderResults() {
      const inputVal = searchInput.value.toLowerCase().trim();
      const activeData = (currentLang === "English") ? dataEN : dataID;
      const resultsEl = document.getElementById("results");

      // Tampilkan/sembunyikan tombol clear (X) berdasarkan isi input
      clearBtn.style.display = searchInput.value.length > 0 ? "flex" : "none";

      if (!Array.isArray(activeData)) {
        resultsEl.innerHTML = "<li class='no-data'>Data format error.</li>";
        bottomAction.style.display = "none";
        return;
      }

      // Pecah input pencarian menjadi array kata kunci
      const keywords = inputVal.split(/\s+/).filter(k => k.length > 0);

      // Filter Data
      const filtered = activeData.filter((row) => {
        if (row[0] === "#" || row[1] === "Question" || row[1] === "Pertanyaan") return false;
        if (keywords.length === 0) return true;

        const rowText = row.join(" ").toLowerCase();

        // LOGIKA AND: Semua potongan kata kunci HARUS cocok
        return keywords.every(keyword => rowText.includes(keyword));
      });

      if (filtered.length === 0) {
        const noDataMsg = currentLang === "English" ? "No data found." : "Tidak ada data ditemukan.";
        resultsEl.innerHTML = `<li class='no-data'>${noDataMsg}</li>`;
        bottomAction.style.display = "none";
        return;
      }

      // Tampilkan tombol "Clear & Search Again" di bawah jika sedang mencari (keywords ada) & ada hasil
      if (keywords.length > 0 && filtered.length > 0) {
        bottomAction.style.display = "block";
        btnSearchAgain.innerText = (currentLang === "English") ? "Clear & Search Again" : "Bersihkan & Cari Lagi";
      } else {
        bottomAction.style.display = "none";
      }

      // Render Hasil
      resultsEl.innerHTML = filtered
        .map(r => {
          const num = r[0] ? `<span class="num">${r[0]}.</span> ` : "";
          const question = formatQuestion(r[1] || "");
          const answer = r[2] ? `<span class="ans-text">${r[2]}</span>` : "";
          
          return `<li>${num}<span class="q-text">${question}</span> ${answer ? '— ' + answer : ''}</li>`;
        })
        .join("");
    }

    // Listener Input Search
    searchInput.addEventListener("input", renderResults);

    // Listener Tombol Clear Top (X)
    clearBtn.addEventListener("click", clearSearch);

    // Listener Tombol Clear Bottom (Search Again)
    btnSearchAgain.addEventListener("click", clearSearch);

    // Listener Toggle Bahasa
    document.getElementById("langToggle").addEventListener("click", function() {
      if (currentLang === "English") {
        currentLang = "Indonesia";
        this.innerText = "Bahasa: Indonesia";
        appTitle.innerText = "Kunci Jawaban Duolingo";
        searchInput.placeholder = "Ketik kata kunci (cth: ba mor)...";
      } else {
        currentLang = "English";
        this.innerText = "Language: English";
        appTitle.innerText = "Duolingo Answer Keys";
        searchInput.placeholder = "Type keywords (e.g. ba mor)...";
      }
      renderResults();
    });

    function updateStatus(msg) {
      document.getElementById("status").innerText = msg;
    }
  </script>
