      max-width: 650px;
      margin: 30px auto;
      padding: 0 15px;
      color: #333;
    }
    .header-tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      gap: 10px;
    }
    .header-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title-wrapper h2 {
      margin: 0;
      font-size: 1.5rem;
    }

    /* Styling Tombol Toggle Bahasa Responsive & Refresh */
    .toggle-btn, .refresh-btn {
      padding: 8px 14px;
      cursor: pointer;
      font-weight: bold;
      border: 1px solid #007bff;
      background-color: #f8f9fa;
      color: #007bff;
      border-radius: 4px;
      transition: all 0.2s;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .toggle-btn:hover, .refresh-btn:hover {
      background-color: #007bff;
      color: #fff;
    }
    
    /* Animasi Putar Tombol Refresh */
    .refresh-icon {
      display: inline-block;
      transition: transform 0.5s ease;
    }
    .refresh-btn.spinning .refresh-icon {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Versi Teks Lengkap Desktop & Ringkas Mobile */
    .lang-text-short {
      display: none;
    }

    @media (max-width: 480px) {
      .lang-text-full {
        display: none;
      }
      .lang-text-short {
        display: inline;
      }
      .toggle-btn, .refresh-btn {
        padding: 6px 10px;
        font-size: 0.9rem;
      }
      .title-wrapper h2 {
        font-size: 1.25rem;
      }
    }

    /* Container Input Search & Tombol Clear X Lebar */
    .search-container {
      position: relative;
      width: 100%;
      margin-bottom: 8px;
    }
    #search {
      width: 100%;
      padding: 10px 48px 10px 12px;
      font-size: 16px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    /* Tombol X Clear */
    .clear-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: #ccc;
      color: #333;
      font-weight: bold;
      font-size: 18px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
      padding: 0;
      transition: background 0.2s, color 0.2s;
    }
    .clear-btn:hover {
      background: #888;
      color: #fff;
    }
    .clear-btn:active {
      background: #555;
      color: #fff;
    }

    #status {
      font-size: 12px;
      color: #666;
      margin-bottom: 15px;
    }
    ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }
    li {
      padding: 12px;
      border-bottom: 1px solid #eee;
      line-height: 1.5;
    }
    li:nth-child(even) {
      background-color: #f9f9f9;
    }
    .no-data {
      color: #888;
      font-style: italic;
    }
    
    /* Styling Visual Jawaban & Pertanyaan */
    .num {
      color: #777;
      font-size: 0.9em;
      margin-right: 4px;
    }
    .q-text {
      color: #222;
    }
    .ans-text {
      color: #28a745;
      font-weight: bold;
    }
    .highlight-lang {
      font-weight: 600;
      color: #0056b3;
    }
    .highlight-quote {
      font-weight: 600;
      color: #d9534f;
    }
    .highlight-brawler {
      font-weight: 600;
      color: #6f42c1;
    }

    /* Badge Centang Ringkas (✓) */
    .validated-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #28a745;
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      margin-left: 6px;
      vertical-align: middle;
      line-height: 1;
    }

    /* Area & Tombol Reset/Search Again Paling Bawah */
    .bottom-action-container {
      margin-top: 20px;
      margin-bottom: 20px;
      text-align: center;
      display: none;
    }
    .btn-search-again {
      width: 100%;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: bold;
      color: #555;
      background-color: #e9ecef;
      border: 1px solid #ced4da;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-search-again:hover {
      background-color: #007bff;
      color: #fff;
      border-color: #007bff;
    }

    /* Styling Footer */
    footer {
      margin-top: 40px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      text-align: center;
      font-size: 0.85rem;
      color: #777;
      line-height: 1.6;
    }
  </style>

    // State Aplikasi (Default: English)
    let currentLang = "English"; 
    let dataID = DEFAULT_DATA.Indonesia;
    let dataEN = DEFAULT_DATA.English;

    // Daftar Bahasa & Negara
    const LANGUAGES = [
      "Indonesia", "Inggris", "Prancis", "Spanyol", "Rusia", "Turki", "Mandarin", 
      "Korea", "Finlandia", "Slovenia", "Wabing", "Wabinglish", "Jepang", "Italia", "Arab", 
      "Polandia", "Belanda", "Hungaria", "Ibrani", "Islandia", "Swahili", "Wales", 
      "Portugis", "Tagalog", "Hawaii", "Hawaiian", "Hindi", "Norwegia", "Irlandia", "Persia", "Farsi",
      "Thailand", "Ukraina", "Melayu", "Brasil", "Brazil", "Yunani", "Swedia", "Jerman", "Vietnam",
      "English", "German", "French", "Spanish", "Russian", "Turkish", "Chinese", 
      "Japanese", "Italian", "Arabic", "Polish", "Dutch", "Hungarian", "Hebrew", 
      "Icelandic", "Portuguese", "Swedish", "Greek", "Vietnamese", "Welsh", "Thai",
      "Finnish", "Indonesian", "Irish", "Korean", "Malay", "Norwegian", "Persian", "Slovenian", "Ukrainian",
      "Hangui", "Hangul", "Cyrillic"
    ];

    // Daftar Brawler & Karakter
    const BRAWLERS = [
      "Spike", "Gene", "Rico", "Ricochet", "Edgar", "Mortis", "Dynamike", "Shelly", 
      "Brock", "Nita", "Bibi", "Poco", "Pam", "Darryl", "Chester", "Melody", "Melodie", 
      "Janet", "Jessie", "Duo", "Scrappy", "Cordelius", "Lily", "Trunk"
    ];

    // Regex Dinamis
    const langRegex = new RegExp(`\\b(${LANGUAGES.join("|")})\\b`, "gi");
    const brawlerRegex = new RegExp(`\\b(${BRAWLERS.join("|")})\\b`, "gi");
    
    // Regex Kutipan: Menjaga seluruh teks pengapit + isi teks secara presisi tanpa merubah karakter
    const quoteRegex = /(?:"{1,2}|'{1,2}|[ʿ‘«“]{1,2})(.*?)(?:"{1,2}|'{1,2}|[ʾ’»”]{1,2})/g;

    const searchInput = document.getElementById("search");
    const clearBtn = document.getElementById("clearSearch");
    const appTitle = document.getElementById("appTitle");
    const bottomAction = document.getElementById("bottomAction");
    const btnSearchAgain = document.getElementById("btnSearchAgain");
    const langToggleBtn = document.getElementById("langToggle");
    const refreshBtn = document.getElementById("refreshBtn");

    document.addEventListener("DOMContentLoaded", async () => {
      // 1. Load dari LocalStorage
      const localID = localStorage.getItem(KEY_ID);
      const localEN = localStorage.getItem(KEY_EN);

      if (localID) {
        try { dataID = JSON.parse(localID); } catch(e){}
      }
      if (localEN) {
        try { dataEN = JSON.parse(localEN); } catch(e){}
      }

      renderResults();

      // 2. Sync background dari API saat awal load
      await fetchAndSyncData();
    });

    // Fungsi Fetch & Sync Data ke LocalStorage
    async function fetchAndSyncData() {
      updateStatus("Syncing data from Spreadsheet...");
      refreshBtn.classList.add("spinning");

      try {
        const res = await fetch(API_URL);
        const data = await res.json();

        if (data && (data.Indonesia || data.English)) {
          dataID = data.Indonesia || DEFAULT_DATA.Indonesia;
          dataEN = data.English || DEFAULT_DATA.English;

          localStorage.setItem(KEY_ID, JSON.stringify(dataID));
          localStorage.setItem(KEY_EN, JSON.stringify(dataEN));

          updateStatus("Data synced and saved to LocalStorage.");
          renderResults();
        }
      } catch (err) {
        console.warn("Fetch Error (Using fallback data):", err);
        updateStatus("Displaying local/cached data.");
      } finally {
        setTimeout(() => refreshBtn.classList.remove("spinning"), 500);
      }
    }

    // Format Teks Pertanyaan (Highlighting)
    function formatQuestion(qText) {
      if (!qText) return "";
      let formatted = String(qText);
      
      // Highlight Kutipan (Merah) - Tampilkan persis apa adanya tanpa modifikasi teks
      formatted = formatted.replace(quoteRegex, `<span class="highlight-quote">$&</span>`);
      
      // Highlight Bahasa (Biru)
      formatted = formatted.replace(langRegex, `<span class="highlight-lang">$1</span>`);
      
      // Highlight Brawler (Ungu)
      formatted = formatted.replace(brawlerRegex, `<span class="highlight-brawler">$1</span>`);
      
      return formatted;
    }

    // Fungsi Reset Search & Fokus Input
    function clearSearch() {
      searchInput.value = "";
      searchInput.focus();
      renderResults();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Render Hasil Pencarian (dengan AND Logika Multi-Keyword)
    function renderResults() {
      const inputVal = searchInput.value.toLowerCase().trim();
      const activeData = (currentLang === "English") ? dataEN : dataID;
      const resultsEl = document.getElementById("results");

      // Tampilkan/sembunyikan tombol clear (X) berdasarkan isi input
      clearBtn.style.display = searchInput.value.length > 0 ? "flex" : "none";

      if (!Array.isArray(activeData)) {
        resultsEl.innerHTML = "<li class='no-data'>Data format error.</li>";
        bottomAction.style.display = "none";
        return;
      }

      // Pecah input pencarian menjadi array kata kunci
      const keywords = inputVal.split(/\s+/).filter(k => k.length > 0);

      // Filter Data
      const filtered = activeData.filter((row) => {
        if (row[0] === "#" || row[1] === "Question" || row[1] === "Pertanyaan") return false;
        if (keywords.length === 0) return true;

        const rowText = row.join(" ").toLowerCase();

        // LOGIKA AND: Semua potongan kata kunci HARUS cocok
        return keywords.every(keyword => rowText.includes(keyword));
      });

      if (filtered.length === 0) {
        const noDataMsg = currentLang === "English" ? "No data found." : "Tidak ada data ditemukan.";
        resultsEl.innerHTML = `<li class='no-data'>${noDataMsg}</li>`;
        bottomAction.style.display = "none";
        return;
      }

      // Tampilkan tombol "Clear & Search Again" di bawah jika sedang mencari & ada hasil
      if (keywords.length > 0 && filtered.length > 0) {
        bottomAction.style.display = "block";
        btnSearchAgain.innerText = (currentLang === "English") ? "Clear & Search Again" : "Bersihkan & Cari Lagi";
      } else {
        bottomAction.style.display = "none";
      }

      // Render Hasil
      resultsEl.innerHTML = filtered
        .map(r => {
          const num = r[0] ? `<span class="num">${r[0]}.</span> ` : "";
          const question = formatQuestion(r[1] || "");
          const answer = r[2] ? `<span class="ans-text">${r[2]}</span>` : "";
          
          // Cek apakah kolom ke-4 (r[3]) bernilai TRUE/true
          const isValidated = (r[3] === true || String(r[3]).toUpperCase() === "TRUE");
          const validatedBadge = isValidated ? `<span class="validated-badge" title="Validated Answer">&#10003;</span>` : "";
          
          return `<li>${num}<span class="q-text">${question}</span> ${answer ? '— ' + answer : ''} ${validatedBadge}</li>`;
        })
        .join("");
    }

    // Listener Input Search
    searchInput.addEventListener("input", renderResults);

    // Global Event Keyboard: Menekan Enter di luar atau di dalam input akan mereset & memfokuskan ke input
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        // Bebaskan fokus dari tombol jika ada yang sedang aktif agar tidak tertekan ulang
        if (document.activeElement && document.activeElement.tagName === "BUTTON") {
          document.activeElement.blur();
        }
        e.preventDefault();
        clearSearch();
      }
    });

    // Listener Tombol Refresh Manual
    refreshBtn.addEventListener("click", fetchAndSyncData);

    // Listener Tombol Clear Top (X)
    clearBtn.addEventListener("click", clearSearch);

    // Listener Tombol Clear Bottom (Search Again)
    btnSearchAgain.addEventListener("click", clearSearch);

    // Listener Toggle Bahasa (Ubah Teks Desktop & Mobile)
    langToggleBtn.addEventListener("click", function() {
      if (currentLang === "English") {
        currentLang = "Indonesia";
        appTitle.innerText = "Kunci Jawaban Duolingo";
        searchInput.placeholder = "Ketik kata kunci (cth: ba mor)...";
        this.innerHTML = `<span class="lang-text-full">Bahasa: Indonesia</span><span class="lang-text-short">🇮🇩 ID</span>`;
      } else {
        currentLang = "English";
        appTitle.innerText = "Duolingo Answer Keys";
        searchInput.placeholder = "Type keywords (e.g. ba mor)...";
        this.innerHTML = `<span class="lang-text-full">Language: English</span><span class="lang-text-short">🇬🇧 EN</span>`;
      }
      renderResults();
    });

    function updateStatus(msg) {
      document.getElementById("status").innerText = msg;
    }
  </script>
