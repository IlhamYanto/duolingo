<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kunci Jawaban Duolingo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 30px auto;
      padding: 0 15px;
      color: #333;
    }
    .header-tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .toggle-btn {
      padding: 8px 16px;
      cursor: pointer;
      font-weight: bold;
      border: 1px solid #007bff;
      background-color: #f8f9fa;
      color: #007bff;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .toggle-btn:hover {
      background-color: #007bff;
      color: #fff;
    }
    #search {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #status {
      font-size: 12px;
      color: #666;
      margin-bottom: 15px;
    }
    ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }
    li {
      padding: 12px;
      border-bottom: 1px solid #eee;
      line-height: 1.4;
    }
    li:nth-child(even) {
      background-color: #f9f9f9;
    }
    .no-data {
      color: #888;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="header-tools">
    <h2 style="margin:0;">Kunci Jawaban Duolingo</h2>
    <!-- Default awal: Bahasa Inggris -->
    <button id="langToggle" class="toggle-btn">Language: English</button>
  </div>

  <input type="text" id="search" placeholder="Type keyword...">
  <div id="status">Loading data...</div>

  <ul id="results"></ul>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz2Wi9VdaplvZh4pZXI7kzKiCcKYHHGwj0WofRj1HYGgP9a2huBSosjvvPd_s5s-joq/exec"; 
    
    // Key terpisah di LocalStorage
    const KEY_ID = "spreadsheet_qa_indonesia";
    const KEY_EN = "spreadsheet_qa_english";

    // State aplikasi (Default: English)
    let currentLang = "English"; 
    let dataID = [];
    let dataEN = [];

    // Executed saat DOM Ready
    document.addEventListener("DOMContentLoaded", async () => {
      // 1. Baca kedua data dari LocalStorage terlebih dahulu
      const localID = localStorage.getItem(KEY_ID);
      const localEN = localStorage.getItem(KEY_EN);

      if (localID) {
        try { dataID = JSON.parse(localID); } catch(e){}
      }
      if (localEN) {
        try { dataEN = JSON.parse(localEN); } catch(e){}
      }

      // Tampilkan data lokal jika ada
      if ((dataID && dataID.length > 0) || (dataEN && dataEN.length > 0)) {
        updateStatus("Displaying cached data from LocalStorage.");
        renderResults();
      }

      // 2. Fetch data terbaru dari Apps Script untuk menimpa kedua LocalStorage
      await fetchAndSyncData();
    });

    // Ambil data terbaru dari Spreadsheet & Simpan ke 2 Key terpisah
    async function fetchAndSyncData() {
      updateStatus("Syncing data from Spreadsheet...");
      try {
        const res = await fetch(API_URL);
        const data = await res.json();

        console.log("Raw Response dari API:", data);

        // Kasus A: Jika API mengembalikan format Objek { Indonesia: [...], English: [...] }
        if (data && (data.Indonesia || data.English)) {
          dataID = data.Indonesia || [];
          dataEN = data.English || [];
        } 
        // Kasus B: Jika API masih versi lama (Array langsung)
        else if (Array.isArray(data)) {
          console.warn("API mengembalikan Array tunggal. Menggunakan array sebagai fallback.");
          dataEN = data;
          dataID = data;
        }

        // SIMPAN KEDUA DATA KE LOCALSTORAGE SECARA TERPISAH
        localStorage.setItem(KEY_ID, JSON.stringify(dataID));
        localStorage.setItem(KEY_EN, JSON.stringify(dataEN));

        updateStatus("Data synced & saved to separate LocalStorage keys.");
        renderResults();

      } catch (err) {
        console.error("Fetch Error:", err);
        if (localStorage.getItem(KEY_ID) || localStorage.getItem(KEY_EN)) {
          updateStatus("Offline mode. Using cached LocalStorage data.");
        } else {
          updateStatus("Failed to load data from server.");
        }
      }
    }

    // Fungsi Render Hasil Pencarian / Tampil Semua
    function renderResults() {
      const keyword = document.getElementById("search").value.toLowerCase().trim();
      
      // Tentukan sumber data berdasarkan bahasa aktif saat ini
      const activeData = (currentLang === "English") ? dataEN : dataID;

      if (!Array.isArray(activeData)) {
        resultsEl.innerHTML = "<li class='no-data'>Data format error.</li>";
        return;
      }

      // Jika keyword kosong, tampilkan SEMUA data dari sheet bahasa yang aktif
      const filtered = activeData.filter(row => {
        if (!keyword) return true;
        return row.some(cell => String(cell).toLowerCase().includes(keyword));
      });

      const resultsEl = document.getElementById("results");

      if (filtered.length === 0) {
        const noDataMsg = currentLang === "English" ? "No data found." : "Tidak ada data ditemukan.";
        resultsEl.innerHTML = `<li class='no-data'>${noDataMsg}</li>`;
        return;
      }

      // Render daftar item
      resultsEl.innerHTML = filtered
        .map(r => `<li>${r.filter(Boolean).join(" - ")}</li>`)
        .join("");
    }

    // Event Listener Instant Search
    document.getElementById("search").addEventListener("input", renderResults);

    // Event Listener Toggle Bahasa (Switch data & UI)
    document.getElementById("langToggle").addEventListener("click", function() {
      if (currentLang === "English") {
        currentLang = "Indonesia";
        this.innerText = "Bahasa: Indonesia";
        document.getElementById("search").placeholder = "Ketik kata kunci...";
      } else {
        currentLang = "English";
        this.innerText = "Language: English";
        document.getElementById("search").placeholder = "Type keyword...";
      }
      
      // Render ulang data menggunakan array bahasa baru
      renderResults();
    });

    function updateStatus(msg) {
      document.getElementById("status").innerText = msg;
    }
  </script>
</body>
</html>
