<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kunci Jawaban Duolingo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 30px auto;
      padding: 0 15px;
      color: #333;
    }
    .header-tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .toggle-btn {
      padding: 8px 16px;
      cursor: pointer;
      font-weight: bold;
      border: 1px solid #007bff;
      background-color: #f8f9fa;
      color: #007bff;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .toggle-btn:hover {
      background-color: #007bff;
      color: #fff;
    }
    #search {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #status {
      font-size: 12px;
      color: #666;
      margin-bottom: 15px;
    }
    ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }
    li {
      padding: 12px;
      border-bottom: 1px solid #eee;
      line-height: 1.4;
    }
    li:nth-child(even) {
      background-color: #f9f9f9;
    }
    .no-data {
      color: #888;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="header-tools">
    <h2 style="margin:0;">Kunci Jawaban Duolingo</h2>
    <button id="langToggle" class="toggle-btn">Bahasa: Indonesia</button>
  </div>

  <input type="text" id="search" placeholder="Ketik kata kunci...">
  <div id="status">Memuat data...</div>

  <ul id="results"></ul>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz2Wi9VdaplvZh4pZXI7kzKiCcKYHHGwj0WofRj1HYGgP9a2huBSosjvvPd_s5s-joq/exec"; 
    const STORAGE_KEY = "spreadsheet_qa_data";

    // State Aplikasi
    let currentLang = "Indonesia"; // Default awal
    let allData = { Indonesia: [], English: [] };

    // Executed saat DOM Ready
    document.addEventListener("DOMContentLoaded", async () => {
      // 1. Baca dari localStorage terlebih dahulu (jika ada)
      const localData = localStorage.getItem(STORAGE_KEY);
      if (localData) {
        try {
          allData = JSON.parse(localData);
          updateStatus("Menampilkan data dari LocalStorage.");
          renderResults(); // Langsung render semua data sesuai bahasa
        } catch (e) {
          console.error("Gagal parse localStorage:", e);
        }
      }

      // 2. Fetch data terbaru dari Apps Script & Timpa LocalStorage
      await fetchAndSyncData();
    });

    // Ambil data dari Apps Script
    async function fetchAndSyncData() {
      updateStatus("Memperbarui data dari Spreadsheet...");
      try {
        const res = await fetch(API_URL);
        const data = await res.json();

        console.log("Data yang didapat dari server:", data);

        // Jika respons berupa array (berarti Apps Script lama), bungkus manual
        if (Array.isArray(data)) {
          allData = { Indonesia: data, English: data };
        } else if (data && !data.error) {
          allData = data;
        }

        // Timpa ke LocalStorage
        localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
        updateStatus("Data berhasil tersimpan & diperbarui.");
        
        // Render ulang UI
        renderResults();

      } catch (err) {
        console.error("Gagal sync data:", err);
        if (localStorage.getItem(STORAGE_KEY)) {
          updateStatus("Offline. Menggunakan data cache LocalStorage.");
        } else {
          updateStatus("Gagal memuat data dari server.");
        }
      }
    }

    // Fungsi Render Hasil (Tampilkan Semua jika keyword kosong)
    function renderResults() {
      const keyword = document.getElementById("search").value.toLowerCase().trim();
      const activeData = allData[currentLang] || [];

      // Jika keyword kosong, tampilkan seluruh data sheet yang aktif
      const filtered = activeData.filter(row => {
        if (!keyword) return true; 
        return row.some(cell => String(cell).toLowerCase().includes(keyword));
      });

      const resultsEl = document.getElementById("results");

      if (filtered.length === 0) {
        resultsEl.innerHTML = "<li class='no-data'>Tidak ada data ditemukan.</li>";
        return;
      }

      // Render daftar item
      resultsEl.innerHTML = filtered
        .map(r => `<li>${r.filter(Boolean).join(" - ")}</li>`)
        .join("");
    }

    // Event Listener Search (Pencarian Instant)
    document.getElementById("search").addEventListener("input", renderResults);

    // Event Listener Toggle Bahasa
    document.getElementById("langToggle").addEventListener("click", function() {
      if (currentLang === "Indonesia") {
        currentLang = "English";
        this.innerText = "Language: English";
        document.getElementById("search").placeholder = "Type keyword...";
      } else {
        currentLang = "Indonesia";
        this.innerText = "Bahasa: Indonesia";
        document.getElementById("search").placeholder = "Ketik kata kunci...";
      }
      // Render ulang seluruh data sesuai bahasa yang dipilih
      renderResults();
    });

    function updateStatus(msg) {
      document.getElementById("status").innerText = msg;
    }
  </script>
</body>
</html>
