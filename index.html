<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finder Q&A</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 30px auto;
      padding: 0 15px;
      color: #333;
    }
    .header-tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .toggle-btn {
      padding: 8px 16px;
      cursor: pointer;
      font-weight: bold;
      border: 1px solid #007bff;
      background-color: #f8f9fa;
      color: #007bff;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .toggle-btn:hover {
      background-color: #007bff;
      color: #fff;
    }
    #search {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #status {
      font-size: 12px;
      color: #666;
      margin-bottom: 15px;
    }
    ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }
    li {
      padding: 12px;
      border-bottom: 1px solid #eee;
      line-height: 1.4;
    }
    li:nth-child(even) {
      background-color: #f9f9f9;
    }
    .no-data {
      color: #888;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="header-tools">
    <h2 style="margin:0;">Search Q&A</h2>
    <button id="langToggle" class="toggle-btn">Bahasa: Indonesia</button>
  </div>

  <input type="text" id="search" placeholder="Ketik kata kunci...">
  <div id="status">Memuat data...</div>

  <ul id="results"></ul>

  <script>
    // Ganti URL ini dengan URL Web App Apps Script milik Anda yang baru di-deploy
    const API_URL = "https://script.google.com/macros/s/AKfycbz2Wi9VdaplvZh4pZXI7kzKiCcKYHHGwj0WofRj1HYGgP9a2huBSosjvvPd_s5s-joq/exec"; 
    const STORAGE_KEY = "spreadsheet_qa_data";

    // State Aplikasi
    let currentLang = "Indonesia"; // 'Indonesia' atau 'English'
    let allData = { Indonesia: [], English: [] };

    // Dijalankan saat document / DOM siap
    document.addEventListener("DOMContentLoaded", async () => {
      // 1. Load data dari LocalStorage terlebih dahulu (jika ada)
      const localData = localStorage.getItem(STORAGE_KEY);
      if (localData) {
        try {
          allData = JSON.parse(localData);
          updateStatus("Menampilkan data dari LocalStorage.");
          renderResults();
        } catch (e) {
          console.error("Gagal parse localStorage:", e);
        }
      }

      // 2. Ambil data terbaru dari Spreadsheet (Background Fetch) lalu timpa LocalStorage
      await fetchAndSyncData();
    });

    // Ambil data terbaru dari Apps Script & Simpan ke LocalStorage
    async function fetchAndSyncData() {
      updateStatus("Memperbarui data dari Spreadsheet...");
      try {
        const res = await fetch(API_URL);
        const data = await res.json();

        console.log("Data diterima dari API:", data);

        // Validasi data tidak kosong
        if (data && !data.error) {
          allData = data;

          // TIMPA LOCALSTORAGE DENGAN DATA BARU
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          
          updateStatus("Data berhasil tersimpan di LocalStorage & siap digunakan.");
          renderResults();
        } else if (data.error) {
          console.error("Server Apps Script Error:", data.error);
          updateStatus("Error dari server: " + data.error);
        }
      } catch (err) {
        console.error("Gagal fetch dari API:", err);
        if (localStorage.getItem(STORAGE_KEY)) {
          updateStatus("Offline/Gagal sync. Menggunakan data cache LocalStorage.");
        } else {
          updateStatus("Gagal memuat data dari server.");
        }
      }
    }

    // Fungsi Render Hasil Pencarian
    function renderResults() {
      const keyword = document.getElementById("search").value.toLowerCase().trim();
      const activeData = allData[currentLang] || [];

      // Filtering pencarian lokal di array
      const filtered = activeData.filter(row => {
        if (!keyword) return true;
        return row.some(cell => String(cell).toLowerCase().includes(keyword));
      });

      // Render ke DOM
      const resultsEl = document.getElementById("results");
      if (filtered.length === 0) {
        resultsEl.innerHTML = "<li class='no-data'>Tidak ada data ditemukan.</li>";
        return;
      }

      resultsEl.innerHTML = filtered
        .map(r => `<li>${r.filter(Boolean).join(" - ")}</li>`)
        .join("");
    }

    // Event Listener Input Keyword (Search Instan)
    document.getElementById("search").addEventListener("input", renderResults);

    // Event Listener Toggle Bahasa
    document.getElementById("langToggle").addEventListener("click", function() {
      if (currentLang === "Indonesia") {
        currentLang = "English";
        this.innerText = "Language: English";
        document.getElementById("search").placeholder = "Type keyword...";
      } else {
        currentLang = "Indonesia";
        this.innerText = "Bahasa: Indonesia";
        document.getElementById("search").placeholder = "Ketik kata kunci...";
      }
      renderResults();
    });

    function updateStatus(msg) {
      document.getElementById("status").innerText = msg;
    }
  </script>
</body>
</html>
